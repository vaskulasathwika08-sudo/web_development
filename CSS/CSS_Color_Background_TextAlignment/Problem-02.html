<!DOCTYPE html>
<html>
<head>
    <title>Tasty Bites Restaurant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f5e8;
        }

        /* Restaurant Header */
        .header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        /* Menu Section */
        .menu {
            padding: 20px;
            text-align: center;
        }

        .menu h2 {
            color:aqua  ;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fffdf0;
        }

        th {
            background-color: orange;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        /* Promotional Section */
        .promotion {
            background-color: #ffe1eb;
            text-align: center;
            padding: 15px;
            color: #b00000;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            background-color: #3b211d;
            color: white;
            padding: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Tasty Bites Restaurant</h1>
        <p>Good Food Makes a Better Mood</p>
    </div>

    <div class="menu">
        <h2>Our Special Dishes</h2>

        <table>
            <tr>
                <th>Dish Name</th>
                <th>Type</th>
                <th>Price</th>
            </tr>

            <tr>
                <td>Margherita Pizza</td>
                <td>Veg</td>
                <td>₹249</td>
            </tr>

            <tr>
                <td>Paneer Butter Masala</td>
                <td>Veg</td>
                <td>₹279</td>
            </tr>

            <tr>
                <td>Chicken Biryani</td>
                <td>Non-Veg</td>
                <td>₹299</td>
            </tr>

            <tr>
                <td>Chocolate Brownie</td>
                <td>Dessert</td>
                <td>₹149</td>
            </tr>
        </table>
    </div>

    <div class="promotion">
        Visit Us & Enjoy Delicious Food!
    </div>

    <div class="footer">
        <span>Open Daily: 11 AM – 11 PM</span>
        <span>Thank You!</span>
    </div>

</body>
</html>
