<!DOCTYPE html>
<html>
<head>
    <title>Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body {
    background: #09b6c7;
    display: flex;
    justify-content: center;
    padding: 50px;
}

.keyboard {
    width: 700px;
    padding: 25px;
    background: #222;

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px;
}

.key {
    background: #333;
    color: #00a8d6;
    padding: 15px;
    text-align: center;
    border-radius: 5px;
}

.space {
    grid-column: 3 / 9;
    background: #333;
    color: white;
    padding: 15px;
    text-align: center;
}
    </style>

<div class="keyboard">

    <div class="key">Esc</div>
    <div class="key">F1</div>
    <div class="key">F2</div>
    <div class="key">F3</div>
    <div class="key">F4</div>
    <div class="key">F5</div>
    <div class="key">F6</div>
    <div class="key">F7</div>
    <div class="key">F8</div>
    <div class="key">F9</div>
    <div class="key">F10</div>
    <div class="key">F11</div>
    <div class="key">F12</div>

    <div class="key">Q</div>
    <div class="key">W</div>
    <div class="key">E</div>
    <div class="key">R</div>
    <div class="key">T</div>
    <div class="key">Y</div>
    <div class="key">U</div>
    <div class="key">I</div>
    <div class="key">O</div>
    <div class="key">P</div>

    <div class="key">A</div>
    <div class="key">S</div>
    <div class="key">D</div>
    <div class="key">F</div>
    <div class="key">G</div>
    <div class="key">H</div>
    <div class="key">J</div>
    <div class="key">K</div>
    <div class="key">L</div>

    <div class="key">Z</div>
    <div class="key">X</div>
    <div class="key">C</div>
    <div class="key">V</div>
    <div class="key">B</div>
    <div class="key">N</div>
    <div class="key">M</div>

    <div class="space">SPACE</div>

</div>

</body>
</html>
