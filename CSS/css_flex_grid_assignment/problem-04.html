<!DOCTYPE html>
<html>
<head>
    <title>Partners</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body {
    font-family: Arial;
    text-align: center;
}

.partners {
    width: 80%;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.partners div {
    padding: 30px;
    background: #f5f5f5;
    border: 1px solid #ddd;
}
    </style>

<h2>Meet Our Partners</h2>

<div class="partners">
    <div>Amazon</div>
    <div>Google</div>
    <div>Microsoft</div>
    <div>IBM</div>
    <div>Oracle</div>
    <div>Infosys</div>
    <div>Wipro</div>
    <div>TCS</div>
</div>

</body>
</html>
