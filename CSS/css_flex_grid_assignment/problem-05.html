<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        .layout {
    width: 600px;
    margin: 50px auto;

    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 100px 100px;
    gap: 10px;
}

.box {
    background: #444;
    color: white;
    padding: 20px;
    font-size: 20px;
}

.a {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
}

.b {
    grid-column: 2 / 3;
    grid-row: 1 / 3;
}

.c {
    grid-column: 1 / 2;
}

.d {
    grid-column: 2 / 3;
}

.e {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
}
    </style>

<div class="layout">
    <div class="box a">A</div>
    <div class="box b">B</div>
    <div class="box c">C</div>
    <div class="box d">D</div>
    <div class="box e">E</div>
</div>

</body>
</html>
