<!DOCTYPE html>
<html>
<head>
    <title>Our Investors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        * {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f8fc;
}

.news {
    width: 80%;
    margin: 40px auto;
    text-align: center;
}

.news-container {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.news-card {
    background: white;
    padding: 25px;
    flex: 1;
    box-shadow: 0 2px 10px #ccc;
}

.investors {
    width: 80%;
    margin: 40px auto;
    text-align: center;
}

.investor-container {
    display: flex;
    justify-content: space-around;
    gap: 20px;
}

.investor-container div {
    background: white;
    padding: 25px 50px;
    flex: 1;
    border: 1px solid #ddd;
}
    </style>

    <section class="news">
        <h2>GLA In The News</h2>

        <div class="news-container">

            <div class="news-card">
                <h3>The Economic Times</h3>
                <p>Latest news and updates.</p>
            </div>

            <div class="news-card">
                <h3>Moneycontrol</h3>
                <p>Business and financial news.</p>
            </div>

            <div class="news-card">
                <h3>VCCircle</h3>
                <p>Startup and investment news.</p>
            </div>

        </div>
    </section>

    <section class="investors">

        <h2>Our Investors, Who Believe In Us</h2>

        <div class="investor-container">

            <div>unitus</div>
            <div>ON INDIA</div>
            <div>indiaQuotient</div>

        </div>

    </section>

</body>
</html>
