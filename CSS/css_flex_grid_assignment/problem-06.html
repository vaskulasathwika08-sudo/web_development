<!DOCTYPE html>
<html>
<head>
    <title>Green Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        .grid {
    width: 600px;
    margin: 50px auto;

    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: 100px 100px 100px;
    gap: 20px;
}

.box {
    background: #23816e;
    border-radius: 3px;
}

.one {
    grid-column: 1;
}

.two {
    grid-column: 2;
}

.three {
    grid-column: 3;
}

.four {
    grid-column: 1 / 3;
}

.five {
    grid-column: 3;
}

.six {
    grid-column: 1;
}

.seven {
    grid-column: 2;
}

.eight {
    grid-column: 3;
}

.nine {
    grid-column: 1 / 3;
}
    </style>

<div class="grid">
    <div class="box one"></div>
    <div class="box two"></div>
    <div class="box three"></div>
    <div class="box four"></div>
    <div class="box five"></div>
    <div class="box six"></div>
    <div class="box seven"></div>
    <div class="box eight"></div>
    <div class="box nine"></div>
</div>

</body>
</html>
