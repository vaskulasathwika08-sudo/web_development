<!DOCTYPE html>
<html>
<head>
    <title>Media Query</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        * {
    box-sizing: border-box;
}

.container {
    width: 80%;
    margin: 30px auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.navigation {
    grid-column: 1 / 5;
    background: yellow;
    padding: 10px;
    font-size: 25px;
}

.box {
    height: 120px;
    padding: 15px;
}

.box1 {
    background: red;
}

.box2 {
    background: #00ff33;
}

.box3 {
    background: #5962e8;
}

.box4 {
    background: #999;
}

/* Medium */
@media (max-width: 768px) {

    .container {
        grid-template-columns: repeat(2, 1fr);
    }

    .navigation {
        grid-column: 1 / 3;
    }
}

/* Small */
@media (max-width: 480px) {

    .container {
        grid-template-columns: 1fr;
    }

    .navigation {
        grid-column: 1;
    }
}
    </style>

<div class="container">

    <div class="navigation">Navigation</div>

    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>

</div>

</body>
</html>
