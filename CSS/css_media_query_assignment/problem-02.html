<!DOCTYPE html>
<html>
<head>
    <title>Rooms and Suites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        * {
    box-sizing: border-box;
}

body {
    font-family: Arial;
    text-align: center;
}

.rooms {
    width: 90%;
    margin: auto;

    display: flex;
    gap: 20px;
}

.room {
    flex: 1;
    padding: 15px;
    border: 1px solid #ddd;
}

.room img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.room h2 {
    margin-bottom: 5px;
}

.room h2 + p {
    color: gray;
}

/* Medium */
@media (max-width: 768px) {

    .rooms {
        flex-wrap: wrap;
    }

    .room {
        flex: 0 0 calc(50% - 10px);
    }
}

/* Small */
@media (max-width: 480px) {

    .rooms {
        display: block;
    }

    .room {
        margin-bottom: 20px;
    }
}
    </style>

<h1>Rooms & Suites</h1>

<div class="rooms">

    <div class="room">
        <img src="https://preview.colorlib.com/theme/sogo/images/room1.jpg">
        <h2>Single Room</h2>
        <p>Comfortable room for one person.</p>
    </div>

    <div class="room">
        <img src="https://preview.colorlib.com/theme/sogo/images/room2.jpg">
        <h2>Family Room</h2>
        <p>Perfect room for families.</p>
    </div>

    <div class="room">
        <img src="https://preview.colorlib.com/theme/sogo/images/room3.jpg">
        <h2>Premium Room</h2>
        <p>Luxury and comfort.</p>
    </div>

</div>

</body>
</html>
