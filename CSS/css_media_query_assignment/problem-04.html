<!DOCTYPE html>
<html>
<head>
    <title>Grid Area Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        .container {
    width: 80%;
    margin: 30px auto;

    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: 50px 250px;
    gap: 10px;
}

header {
    grid-area: header;
    background: yellow;
}

main {
    grid-area: main;
    background: red;
    padding: 20px;
}

.box1 {
    grid-area: box1;
    background: #00ff33;
}

.box2 {
    grid-area: box2;
    background: #00ff33;
}

.box3 {
    grid-area: box3;
    background: #00ff33;
}

.container {
    grid-template-areas:
        "header header"
        "main box1"
        "main box2"
        "main box3";
}

/* Medium */
@media (max-width: 768px) {

    .container {
        grid-template-columns: 1fr 1fr 1fr;

        grid-template-areas:
            "header header header"
            "main main main"
            "box1 box2 box3";
    }
}

/* Small */
@media (max-width: 480px) {

    .container {
        grid-template-columns: 1fr;

        grid-template-areas:
            "header"
            "main"
            "box1"
            "box2"
            "box3";
    }
}
    </style>

<div class="container">

    <header>Navigation</header>

    <main>Main Content</main>

    <div class="box1">Right Box 1</div>
    <div class="box2">Right Box 2</div>
    <div class="box3">Right Box 3</div>

</div>

</body>
</html>
