<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        .container {
    width: 80%;
    margin: auto;

    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;
}

header {
    grid-column: 1 / 3;
    background: yellow;
    padding: 10px;
    font-size: 25px;
}

.left {
    background: red;
    min-height: 250px;
    padding: 20px;
}

.right {
    display: grid;
    gap: 10px;
}

.right div {
    background: #00ff33;
    padding: 20px;
}

/* Medium */
@media (max-width: 768px) {

    .container {
        grid-template-columns: 1fr;
    }

    header {
        grid-column: 1;
    }

    .right {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Small */
@media (max-width: 480px) {

    .container {
        grid-template-columns: 1fr;
    }

    .right {
        grid-template-columns: 1fr;
    }
}
    </style>

<div class="container">

    <header>Navigation</header>

    <div class="left">LEFT BOX</div>

    <div class="right">
        <div>RIGHT BOX 1</div>
        <div>RIGHT BOX 2</div>
        <div>RIGHT BOX 3</div>
    </div>

</div>

</body>
</html>
