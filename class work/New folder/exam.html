<!DOCTYPE html>
<html lang="en">
<head>

    <title>FORMS</title>

</head>
<body>

    <label for="name">STUDENT NAME</label>
    <input username="name" type="text" placeholder="Enter your name"><br></br>

    <label for="email">STUDENT EMAIL</label>
    <input username="email" type="text" placeholder="gla@email.com"><br></br>
    
    <button type="submit" >send message</button><br></br>

    <label for="moblie number">phone number</label>
    <input username="moblie number" type="text"  placeholder="9676757765"><br></br>

    <label for="website">website</label>
    <input username="website" type="url" placeholder="www.com@gla.com"><br></br>

    <label for="password">Password</label>
    <input username="password" type="password" placeholder="atleast 8 character"><br></br>
    <label for="qunatity">Quantity</label>
    <input username="qunatity" type="number" placeholder="1" min="1" max="100"><br></br>
    <label for="date of birth">Date of Birth</label>
    <input username="date of birth" type="date" placeholder="dd/mm/yyyy"><br></br>

    <label>
        <input username="checkbox" type="checkbox"> I agree to the terms and conditions
    </label><br></br>
    <label for="gender">Gender</label>
    <input username="gender" type="radio" name="gender" value="female">female
    <input username="gender" type="radio" name="gender" value="male">male<br></br>
    <input username="gender" type="radio" name="gender" value="others">others<br></br>
    
</body>
</html>
